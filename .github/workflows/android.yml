# Builds the Android app (a Trusted Web Activity wrapping the live site) and sends it to Google Play.
#
# Runs from the Actions tab ("Run workflow") or when main is pushed to the play-release branch.
# Secrets (Settings > Secrets and variables > Actions):
#   ANDROID_KEYSTORE_BASE64    upload key (base64 of the .keystore file), alias "upload" or ANDROID_KEY_ALIAS
#   ANDROID_KEYSTORE_PASSWORD  keystore password
#   ANDROID_KEY_PASSWORD       key password (optional, defaults to the keystore password)
#   ANDROID_KEY_ALIAS          key alias (optional, defaults to "upload")
#   PLAY_SERVICE_ACCOUNT_JSON  Google Play service account key (JSON)
# Without the keystore secrets it still builds with a throwaway key, to check the pipeline, and uploads nothing.
name: Android (Google Play)
on:
  workflow_dispatch:
    inputs:
      track:
        description: 'Play track: internal, alpha (closed testing), beta (open testing) or production'
        default: internal
      status:
        description: 'Release status: completed, or draft while the app is still a draft in Play Console'
        default: completed
  push:
    branches: [play-release]
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-24.04
    env:
      HAS_PLAY: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON != '' }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with: { distribution: temurin, java-version: '17' }
      - uses: actions/setup-node@v5
        with: { node-version: '22' }
      - name: Install Bubblewrap
        run: |
          npm install -g @bubblewrap/cli@1.25.0
          # Bubblewrap still validates the SDK by its legacy "tools" folder: point it at cmdline-tools
          [ -e "$ANDROID_HOME/tools" ] || sudo ln -s "$ANDROID_HOME/cmdline-tools/latest" "$ANDROID_HOME/tools"
          ls "$ANDROID_HOME" "$ANDROID_HOME/build-tools" | tr '\n' ' ' | sed 's/^/::notice::SDK: /'; echo
          mkdir -p ~/.bubblewrap
          echo "{\"jdkPath\":\"$JAVA_HOME\",\"androidSdkPath\":\"$ANDROID_HOME\"}" > ~/.bubblewrap/config.json
      - name: Version from version.js, build number from the run
        run: |
          NAME=$(grep -oP "APP_VERSION = '\K[^']+" version.js)
          CODE=$((100 + GITHUB_RUN_NUMBER))
          jq --arg n "$NAME" --argjson c $CODE '.appVersionName=$n | .appVersion=$n | .appVersionCode=$c' \
            android/twa-manifest.json > m.json && mv m.json android/twa-manifest.json
          echo "::notice::Building $NAME (versionCode $CODE)"
      - name: Signing key
        id: key
        env:
          KS: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KS_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_PASS: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          cd android
          if [ -n "$KS" ]; then
            echo "$KS" | base64 -d > upload.keystore
            ALIAS=${ALIAS:-upload}
            PASSV=$KS_PASS
            echo "BUBBLEWRAP_KEYSTORE_PASSWORD=$KS_PASS" >> $GITHUB_ENV
            echo "BUBBLEWRAP_KEY_PASSWORD=${KEY_PASS:-$KS_PASS}" >> $GITHUB_ENV
            echo "real=true" >> $GITHUB_OUTPUT
          else
            ALIAS=upload
            P=$(openssl rand -hex 16)
            PASSV=$P
            keytool -genkeypair -keystore upload.keystore -storetype PKCS12 -alias upload -keyalg RSA -keysize 2048 \
              -validity 30 -storepass $P -keypass $P -dname "CN=Pipeline check" >/dev/null 2>&1
            echo "BUBBLEWRAP_KEYSTORE_PASSWORD=$P" >> $GITHUB_ENV
            echo "BUBBLEWRAP_KEY_PASSWORD=$P" >> $GITHUB_ENV
            echo "real=false" >> $GITHUB_OUTPUT
            echo "::warning::No ANDROID_KEYSTORE_BASE64 secret: built with a throwaway key, nothing will be uploaded"
          fi
          jq --arg a "$ALIAS" '.signingKey.alias=$a' twa-manifest.json > m.json && mv m.json twa-manifest.json
          # The SHA-256 fingerprint goes into .well-known/assetlinks.json (public value, safe to print)
          FP=$(keytool -list -v -keystore upload.keystore -storepass "$PASSV" | grep -m1 'SHA256:' | sed 's/.*SHA256: //')
          echo "::notice::Signing key SHA-256: $FP"
      - name: Build the Android App Bundle
        run: |
          cd android
          run() {
            if ! "$@" > step.log 2>&1 < /dev/null; then
              echo "::error::$1 $2 failed: $(tail -c 2500 step.log | tr '\n' ' ')"
              exit 1
            fi
            tail -n 5 step.log
          }
          run bubblewrap update --skipVersionUpgrade --manifest=./twa-manifest.json
          run bubblewrap build --skipPwaValidation --manifest=./twa-manifest.json
          ls -la *.aab *.apk
      - uses: actions/upload-artifact@v4
        with:
          name: manic-math-android
          path: |
            android/app-release-bundle.aab
            android/app-release-signed.apk
      - name: Upload to Google Play
        if: steps.key.outputs.real == 'true' && env.HAS_PLAY == 'true'
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: pt.bicagames.manicmath
          releaseFiles: android/app-release-bundle.aab
          track: ${{ github.event.inputs.track || 'internal' }}
          status: ${{ github.event.inputs.status || 'completed' }}
