# Sends the store listing (titles, descriptions, icon, feature graphic, screenshots in PT and EN)
# from fastlane/metadata/android to Google Play. Runs from the Actions tab or when main is pushed
# to the play-listing branch. Needs the PLAY_SERVICE_ACCOUNT_JSON secret and the app created in Play Console.
name: Store listing (Google Play)
on:
  workflow_dispatch:
  push:
    branches: [play-listing]
permissions:
  contents: read
jobs:
  listing:
    runs-on: ubuntu-24.04
    env:
      PLAY_JSON: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
    steps:
      - uses: actions/checkout@v5
      - name: Check credentials
        run: |
          if [ -z "$PLAY_JSON" ]; then echo "::error::Missing PLAY_SERVICE_ACCOUNT_JSON secret"; exit 1; fi
      - uses: ruby/setup-ruby@v1
        with: { ruby-version: '3.3' }
      - name: Upload listing with fastlane supply
        run: |
          gem install fastlane --no-document -q
          echo "$PLAY_JSON" > play.json
          if ! fastlane supply --package_name pt.bicagames.manicmath --json_key play.json \
              --metadata_path fastlane/metadata/android \
              --skip_upload_apk true --skip_upload_aab true --skip_upload_changelogs true \
              --sync_image_upload true > supply.log 2>&1; then
            echo "::error::supply failed: $(tail -c 2500 supply.log | tr '\n' ' ')"
            exit 1
          fi
          tail -n 5 supply.log
